<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8"/>
    </head>
    <body>
        <div id="content">

        </div>
    </body>
    <script>
        fetch('http://localhost/php/kurs/api/getInfraHeatersAsJSON.php')
  .then(response => response.json()) // or response.text(), etc.
  .then(data => {
    let content=``;
    for (let i=0;i<data.infraHeaters.length;i++){
        content+=`
            Інфрачервоний обігрівач `+data.infraHeaters[i].vendor+` `+data.infraHeaters[i].model+`</br>
            Ціна: `+data.infraHeaters[i].price+`</br>
            Принцип роботи: `+data.infraHeaters[i].workPrinc+`</br>
            Сфера застосування: `+data.infraHeaters[i].sphereOfAppl+`</br>
            Характеристики: </br>
        `;
        console.log(content);
        for (const key in data.infraHeaters[i].properties) {
            content+=`${key}: ${data.infraHeaters[i].properties[key]} </br>`;
        }
        
    }
    document.getElementById('content').innerHTML=content;
  })
  .catch(error => console.error('Error:', error));
    </script>
</html>
